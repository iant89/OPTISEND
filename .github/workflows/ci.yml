name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install numpy==1.26.4 opencv-contrib-python-headless==4.10.0.84

      - name: Type-check
        run: |
          npm run typecheck
          npm run typecheck:sandbox

      - name: Build
        run: npm run build

      - name: Unit and optical tests
        run: npm test

      - name: Verify QR capacities
        run: npm run verify:qr

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # These tests simulate camera transfers and are resource-intensive; avoid
      # running their test files simultaneously on shared GitHub runners.
      - name: Browser end-to-end tests
        run: node --import tsx --test --test-concurrency=1 e2e/*.test.ts
